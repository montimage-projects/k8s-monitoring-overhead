apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmt-node-worker
  namespace: testbed
spec:
  selector:
    matchLabels:
      app: mmt-node-worker
  template:
    metadata:
      labels:
        app: mmt-node-worker
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      hostNetwork: true
      containers:
      - name: mmt-probe
        image: ghcr.io/montimage/mmt-probe:v1.6.2
        imagePullPolicy: IfNotPresent
        # run probe during 10 seconds
        #command: ["timeout", "--signal=2", "10", "mmt-probe"]
        args:
        - "-iany"
        - "-Xstack-type=624" #Linux cooked capture
        - "-Xprobe-id=2"
        - "-Xinput.pcap-filter=not tcp port 22 and not ip6 and not dst host 255.255.255.255 and not net 224.0.0.0/4"
